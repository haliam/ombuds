name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make test

  integration:
    name: integration + policy tests
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
      DATABASE_URL: postgresql://ombuds:ci-only-password@localhost:5432/ombuds
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ombuds
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ombuds
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ombuds -d ombuds"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Same image and flags as the compose `opa` service; a job service can't mount the repo's policies.
      - name: Start OPA
        run: |
          docker run -d --name opa -p 8181:8181 \
            -v "$PWD/src/ombuds/platform/guardrails/policies:/policies:ro" \
            openpolicyagent/opa:1.4.2 run --server --addr=0.0.0.0:8181 --ignore='*_test.rego' /policies
          for _ in $(seq 30); do
            curl -sf http://localhost:8181/health && exit 0
            sleep 1
          done
          docker logs opa
          exit 1
      - run: make test-policy
      # The suites skip when a service is unreachable; under CI that is a failure (see tests/integration).
      - run: uv run pytest tests/integration -m integration

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
