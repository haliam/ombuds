services:
  # Postgres + pgvector: relational tables and KB embeddings in one database (ADR-0010).
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ombuds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ombuds
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ombuds -d ombuds"]
      interval: 2s
      timeout: 3s
      retries: 20

  # OPA policy server (ADR-0015): evaluates policies/*.rego for the approval gate. The gate fails closed if it is down.
  opa:
    image: openpolicyagent/opa:1.4.2
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--ignore=*_test.rego", "/policies"]
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - ./src/ombuds/platform/guardrails/policies:/policies:ro
    # The image has no shell or curl, so the probe is an `opa eval` that GETs the server's own /health.
    healthcheck:
      test: ["CMD", "/opa", "eval", "--fail", "http.send({\"method\": \"get\", \"url\": \"http://localhost:8181/health\"}).status_code == 200"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-shot: apply migrations, then chunk + embed the KB seed docs. Idempotent, so safe on every `up`.
  # The API never migrates on its own, so it waits for this to finish.
  migrate-ingest:
    build: .
    image: ombuds
    command: ["python", "-m", "ombuds.features.claims_triage.rag.ingest"]
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ombuds:${POSTGRES_PASSWORD}@db:5432/ombuds
    depends_on:
      db:
        condition: service_healthy

  # Approvals are in Postgres (ADR-0009), so the API keeps no per-process approval state.
  # MCP tool dispatch spawns its stdio server as a subprocess of this container (ADR-0003).
  api:
    build: .
    image: ombuds
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ombuds:${POSTGRES_PASSWORD}@db:5432/ombuds
      OPA_URL: http://opa:8181
    depends_on:
      db:
        condition: service_healthy
      opa:
        condition: service_healthy
      migrate-ingest:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
